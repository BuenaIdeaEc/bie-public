[build]
  command   = "npm run build"
  publish   = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Redirect www → apex (canonical domain)
[[redirects]]
  from   = "https://www.businessintelligence.solutions/*"
  to     = "https://businessintelligence.solutions/:splat"
  status = 301
  force  = true

# Redirect del subdominio Netlify → dominio propio (evita contenido duplicado en Google)
[[redirects]]
  from   = "https://bie-website.netlify.app/*"
  to     = "https://businessintelligence.solutions/:splat"
  status = 301
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "DENY"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# BIE-P06 — el sitio anterior se retiró; sus URLs apuntan a la nueva home
[[redirects]]
  from   = "/casos/*"
  to     = "/"
  status = 301

[[redirects]]
  from   = "/servicios/*"
  to     = "/#catalog"
  status = 301

[[redirects]]
  from   = "/contacto"
  to     = "/#contact"
  status = 301

[[redirects]]
  from   = "/sobre-bie"
  to     = "/"
  status = 301

[[redirects]]
  from   = "/satelites"
  to     = "/#work"
  status = 301
