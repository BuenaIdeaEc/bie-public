[build]
  command   = "npm run build"
  publish   = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  # package.json exige >=22.12.0 (Astro 6); estaba en 20 aquí, por debajo del mínimo real.
  NODE_VERSION = "22"

# Redirect www → apex (canonical domain)
[[redirects]]
  from   = "https://www.businessintelligence.solutions/*"
  to     = "https://businessintelligence.solutions/:splat"
  status = 301
  force  = true

# Redirect del subdominio Netlify → dominio propio (evita contenido duplicado en Google)
[[redirects]]
  from   = "https://bie-website.netlify.app/*"
  to     = "https://businessintelligence.solutions/:splat"
  status = 301
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "DENY"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "camera=(), microphone=(), geolocation=()"

# Assets con hash en el nombre (Astro los emite en /_astro/): cache de un año
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fuentes e imágenes: nombres estables, cache larga (se revalida al cambiar el archivo)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/presentaciones/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# BIE-P06 — el sitio anterior se retiró; sus URLs apuntan a la nueva home
[[redirects]]
  from   = "/casos/*"
  to     = "/"
  status = 301

[[redirects]]
  from   = "/servicios/*"
  to     = "/#catalog"
  status = 301

[[redirects]]
  from   = "/contacto"
  to     = "/#contact"
  status = 301

[[redirects]]
  from   = "/sobre-bie"
  to     = "/"
  status = 301

[[redirects]]
  from   = "/satelites"
  to     = "/#work"
  status = 301
